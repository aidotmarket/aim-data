name: Preview contract parity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  producer-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VECTORAIZ_AUTH_ENABLED: 'false'
      VECTORAIZ_DATA_DIRECTORY: /tmp/preview-contract/data
      VECTORAIZ_UPLOAD_DIRECTORY: /tmp/preview-contract/uploads
      VECTORAIZ_PROCESSED_DIRECTORY: /tmp/preview-contract/processed
      DATABASE_URL: sqlite:////tmp/preview-contract/test.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare isolated test storage
        run: |
          mkdir -p /tmp/preview-contract/{data,uploads,processed}
          sudo mkdir -p /data
          sudo chown "$(id -u):$(id -g)" /data
      - name: Install producer and test dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Check pinned fixture bytes
        run: python scripts/check_preview_fixture_parity.py
      - name: Independent Node differential verifier
        run: node tests/preview_differential_check.cjs
      - name: Focused 2a through 2e backend contracts
        run: >-
          python -m pytest -q
          tests/test_dataset_canonicalization.py tests/test_dataset_merkle_service.py
          tests/test_preview_content_policy.py tests/test_preview_package_service.py
          tests/test_preview_origin_service.py tests/test_preview_signing_service.py
          tests/test_preview_disclosure_schemas.py tests/test_marketplace_commitment_push.py
          tests/test_preview_lifecycle.py tests/test_preview_build_routes.py
          tests/test_vz_publish_proxy.py tests/test_dataset_publish_signed_proxy.py
          tests/test_s804_disclosure_dataset_detail.py
          tests/test_preview_fixture_parity.py tests/test_preview_producer_evidence.py
          --junitxml=/tmp/preview-contract/focused.xml
      - name: Build synthetic producer bundle through real services
        run: >-
          python tests/run_preview_producer_synthetic.py
          --output /tmp/preview-contract/synthetic-bundle
          --reference tests/fixtures/preview-producer-synthetic-shas.json
      - name: Focused 2d browser contracts
        working-directory: frontend
        run: |
          npm ci
          npm test -- src/components/CommitmentPreviewBuilder.test.tsx src/components/PreviewOriginReview.test.tsx src/lib/disclosure.test.ts src/pages/DatasetDetail.test.tsx
          npm run build
      - name: Retain synthetic metadata receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-contract-receipts
          path: |
            /tmp/preview-contract/focused.xml
            /tmp/preview-contract/synthetic-bundle/manifest.json
            /tmp/preview-contract/synthetic-bundle/synthetic-provenance.json
          if-no-files-found: warn
